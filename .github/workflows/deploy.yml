name: Deploy to GCS

on:
  push:
    branches: [master, main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          echo "=== OIDC token claims ==="
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=//iam.googleapis.com/projects/210615044241/locations/global/workloadIdentityPools/github-pool/providers/github-gitforest" \
            | python3 -c "import sys,json; t=json.load(sys.stdin)['value']; import base64; p=t.split('.')[1]; p+='='*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/210615044241/locations/global/workloadIdentityPools/github-pool/providers/github-gitforest'
          service_account: 'gitforest-deploy@npcsh-449102.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: npcsh-449102

      - name: Sync to bucket
        run: |
          gcloud storage rsync -r . gs://gitforest-website \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="README.md" \
            --delete-unmatched-destination-objects

      - name: Set short cache TTL on HTML files
        run: |
          gcloud storage objects update "gs://gitforest-website/**.html" \
            --cache-control="public, max-age=60"
